name: Astro build and S3 deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Prevent multiple concurrent runs for the same branch/ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Set permissions for AWS OIDC authentication (preferred) or access keys
    permissions:
      id-token: write # Required for OIDC
      contents: read  # Required for checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Use OIDC (preferred, requires setup in AWS) or Access Keys
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # Use if not using OIDC
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # Use if not using OIDC
          aws-region: us-west-2
          # role-to-assume: arn:aws:iam::ACCOUNT-ID-WITHOUT-HYPHENS:role/ROLE-NAME # Example for OIDC

      - name: Deploy site to AWS S3
        run: |
          # Fingerprinted build output (/_astro/*.hash.css etc.) never changes; cache it for a year.
          # No --delete here: pages cached by browsers may still reference older hashes.
          aws s3 sync ./dist/_astro/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/_astro/ \
          --cache-control max-age=31536000,public,immutable
          aws s3 sync ./dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
          --delete \
          --exclude "_astro/*" \
          --cache-control max-age=604800,public
        # Assumes bucket is private and accessed via CloudFront OAI/OAC.

      - name: Invalidate AWS CloudFront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
