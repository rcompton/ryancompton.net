name: Astro build and S3 deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Prevent multiple concurrent runs for the same branch/ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # AWS OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Sanity-check build
        run: node scripts/check-site.mjs dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Only master of this repo can assume this role; it can sync the bucket and
          # invalidate the distribution, nothing else.
          role-to-assume: arn:aws:iam::535249286932:role/github-actions-ryancompton-net
          aws-region: us-west-2

      - name: Deploy site to AWS S3
        run: |
          # Fingerprinted build output (/_astro/*.hash.css etc.) never changes; cache it for a year.
          # No --delete here: pages cached by browsers may still reference older hashes.
          aws s3 sync ./dist/_astro/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/_astro/ \
          --cache-control max-age=31536000,public,immutable
          aws s3 sync ./dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
          --delete \
          --exclude "_astro/*" \
          --cache-control max-age=604800,public

      - name: Invalidate AWS CloudFront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
